name: testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  semanas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 ruff==0.7.4
      - name: Lint
        run: ruff check .
      - name: Testes de cada semana
        run: |
          set -e
          shopt -s nullglob
          for d in 20*-W*/; do
            echo "== $d"
            (cd "$d" && python -m pytest)
          done
