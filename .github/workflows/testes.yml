name: testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  semanas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 ruff==0.7.4
      - name: Lint
        run: ruff check .
      - name: Testes de cada semana
        run: |
          set -e
          shopt -s nullglob
          for d in 20*-W*/; do
            echo "== $d"
            (cd "$d" && python -m pytest)
          done
